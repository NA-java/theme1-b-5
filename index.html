<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SubManager</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
</head>
<body>
    <h1>SubManager</h1>

    <!-- サービス登録フォーム -->
    <h2>サービスの登録</h2>

    <label for="service-input">契約しているサービス名</label>
    <input id="service-input" type="text" placeholder="例：Netflix">

    <label for="update-input">サービスの更新日</label>
    <input id="update-input" type="date">

    <button id="add-button" type="button">登録</button>

    <!-- 更新日リマインダー -->
    <h2>更新日が近いサービス</h2>
    <ul id="reminder-list"></ul>

    <!-- 登録済みサービス一覧 -->
    <h2>登録サービス一覧</h2>
    <ul id="service-list"></ul>

</body>
</html>
